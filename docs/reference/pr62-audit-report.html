.form-range::-moz-range-track {

.form-range::-moz-range-thumb {

          &lt;/tr&gt;
          &lt;tr data-finding=&quot;H-04&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;H-04&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;High&lt;/td&gt;
            &lt;td&gt;Disney playback state is English-only and can invert the action&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;The media element state is authoritative and controls are only an action mechanism; localized-label regressions are covered.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;H-05&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;H-05&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;High&lt;/td&gt;
            &lt;td&gt;Platform initialization is not single-flight&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;A root-reviewed lifecycle generation and single-flight guard reject stale initialization completions and clean up only their own attempt.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;M-01&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;M-01&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;Medium&lt;/td&gt;
            &lt;td&gt;Final-retry controls are removed by the sanitizer.&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;Terminal retry controls are created through DOM APIs with programmatic listeners after sanitized content; the exact final-attempt path is covered.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;M-02&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;M-02&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;Medium&lt;/td&gt;
            &lt;td&gt;AI-context restarts leak five Base-owned listeners.&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;AI feature listeners now have feature-lifecycle ownership and are drained before restart or disable; repeated-change coverage checks listener counts.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;M-03&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;M-03&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;Medium&lt;/td&gt;
            &lt;td&gt;Platform pause failure prevents generic fallback.&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;Platform pause/resume returns early only after verified success. Generic media-element fallback is used only when the adapter explicitly allows direct playback control; Disney fails closed when its native controller is unavailable, preventing media/UI split-brain.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;M-04&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;M-04&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;Medium&lt;/td&gt;
            &lt;td&gt;Netflix settings-read failure poisons the subtitle URL.&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;Rejected settings reads are handled, and only the initiating request may remove its processed marker and reopen retry.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;M-05&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;M-05&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;Medium&lt;/td&gt;
            &lt;td&gt;An optional Netflix target-track failure discards a valid original.&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;Optional target-track fetch and parse failures fall back to the already-valid original track instead of aborting the operation.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;M-06&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;M-06&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;Medium&lt;/td&gt;
            &lt;td&gt;Malformed WebVTT timestamps become time zero.&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;Timestamp parsing now rejects malformed, non-finite, and non-increasing cue ranges rather than coercing them to zero.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;M-07&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;M-07&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;Medium&lt;/td&gt;
            &lt;td&gt;The TTML/WebVTT boundary corrupts valid text.&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;Shared cue-text normalization preserves intended breaks and literals while escaping once at rendering; parser-to-DOM cases are covered.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;M-08&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;M-08&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;Medium&lt;/td&gt;
            &lt;td&gt;&lt;code&gt;SliderSetting&lt;/code&gt; drops the latest overlapping commit.&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;A last-write-wins serialized commit path retains the newest release while an earlier write is pending.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;M-09&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;M-09&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;Medium&lt;/td&gt;
            &lt;td&gt;Optimistic settings are not reconciled after storage failure.&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;Write generations reconcile failure without rolling back a newer value. Missing or malformed producer acknowledgements remove optimistic raw input and trigger exact-key strict readback, so only canonical persisted values become authority.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;M-10&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;M-10&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;Medium&lt;/td&gt;
            &lt;td&gt;&lt;code&gt;getAll()&lt;/code&gt; hides storage failure as successful defaults.&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;&lt;code&gt;getAll()&lt;/code&gt; and strict reads reject degraded storage instead of promoting defaults; callers preserve prior authoritative state and recover on later valid storage events.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;M-11&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;M-11&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;Medium&lt;/td&gt;
            &lt;td&gt;Configuration validation is type-only.&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;Canonical schema constraints, repair projection, listener isolation, and safe error logging were root-replayed across 16 suites / 436 tests, plus 25 AI-context tests.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;M-12&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;M-12&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;Medium&lt;/td&gt;
            &lt;td&gt;Batch fallback repeats already-successful provider calls.&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;The dormant batch surface and its duplicate fallback ownership were removed. Catalog and source guards prevent &lt;code&gt;translateBatch&lt;/code&gt; or &lt;code&gt;checkBatchSupport&lt;/code&gt; from returning to production.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;M-13&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;M-13&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;Medium&lt;/td&gt;
            &lt;td&gt;Platform observer retries can resurrect after cleanup.&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;Retry timers are lifecycle-owned, canceled during cleanup, and prevented from reviving a stale platform generation.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;M-14&quot; data-status=&quot;residual&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;M-14&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;Medium&lt;/td&gt;
            &lt;td&gt;Public page events can drive privileged cross-origin fetches.&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;residual&quot;&gt;Residual&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;Capability minting, exact-copy authorization, revocation, route identity, top-frame sender binding, fixed CDN allowlists, Disney-only redirect following with final-response validation, non-Disney redirect rejection, and streaming byte limits are enforced. Accepted residuals are page-observable same-document token replay, transparent proxies or monkey-patched page primitives, never-settling thenables, and the Netflix 2 MiB ceiling without live-catalog validation.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;M-15&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;M-15&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;Medium&lt;/td&gt;
            &lt;td&gt;Playlist fan-out is unbounded.&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;Playlist, line, segment, and aggregate byte limits combine with bounded concurrency and terminal abort behavior.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;M-16&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;M-16&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;Medium&lt;/td&gt;
            &lt;td&gt;Retry ownership permits up to six provider calls per cue.&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;The background owns provider retry and pacing; content retries only explicit transport non-acceptance with structured retry metadata.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;M-17&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;M-17&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;Medium&lt;/td&gt;
            &lt;td&gt;Long-window quota controls reset with the MV3 worker.&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;False long-window guarantees were removed. Microsoft is explicitly a worker-instance one-minute guard, while DeepL quota truth comes from provider responses; provider documentation matches the active contract.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;M-18&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;M-18&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;Medium&lt;/td&gt;
            &lt;td&gt;The cross-context protocol is no longer authoritative.&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;Every active cross-context route is catalogued and uses exact builders/parsers, sender-role classification, and correlated response parsing. Base owns semantic config preparation; legacy type fallback, zero-sender toggle actions, platform hooks, dormant actions, and their compatibility tests are removed and source-guarded.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;M-19&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;M-19&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;Medium&lt;/td&gt;
            &lt;td&gt;Navigation and DOM observation multiply work.&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;Base owns and replaces the sole navigation manager; platform subclasses only delegate setup. URL checks are coalesced, cleanup is terminal, player observers are restricted to verified roots and a bounded shell, and frame presentation performs constant-time checks between cue boundaries instead of rescanning the episode queue.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;L-01&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;L-01&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;Low&lt;/td&gt;
            &lt;td&gt;Reset bypasses dynamic defaults.&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;Reset resolves the schema’s dynamic default instead of copying a static default value.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;L-02&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;L-02&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;Low&lt;/td&gt;
            &lt;td&gt;Popup localization has an async stale-response race.&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;Locale loading commits only the latest request generation and reuses the shared cached loader.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;L-03&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;L-03&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;Low&lt;/td&gt;
            &lt;td&gt;Popup range controls remove visible keyboard focus.&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;Range controls retain a visible &lt;code&gt;:focus-visible&lt;/code&gt; indicator for keyboard navigation.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;L-04&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;L-04&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;Low&lt;/td&gt;
            &lt;td&gt;Disney media playlists are fetched twice.&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;The parser accepts the already-fetched playlist text and base URL, avoiding a second signed-URL request.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;L-05&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;L-05&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;Low&lt;/td&gt;
            &lt;td&gt;Individual batch fallback double-applies mandatory throttling.&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;The central provider gate is the sole owner of mandatory delay during individual fallback.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;L-06&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;L-06&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;Low&lt;/td&gt;
            &lt;td&gt;Rate-limit reset time is always “now.”&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;Reset time is derived from the oldest retained request plus its governing window.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;L-07&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;L-07&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;Low&lt;/td&gt;
            &lt;td&gt;Netflix retains the full cue queue after leaving playback.&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;Shared page-leave cleanup clears retained subtitle cues consistently across platforms.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;L-08&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;L-08&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;Low&lt;/td&gt;
            &lt;td&gt;Popup loads and subscribes to every credential.&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;Sensitive inclusion is opt-in, and popup subscriptions receive an explicit non-sensitive key projection.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;L-09&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;L-09&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;Low&lt;/td&gt;
            &lt;td&gt;Dormant batch translation bypasses cache and can report total failure as success.&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;The dormant duplicate surface was removed or routed through the cache-aware per-item result contract; total failure is no longer reported as success.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;L-10&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;L-10&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;Low&lt;/td&gt;
            &lt;td&gt;AI manager metrics erase their own values.&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;Teardown records metrics before clearing state and retains the resulting summary.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr data-finding=&quot;L-11&quot; data-status=&quot;fixed&quot;&gt;
            &lt;th scope=&quot;row&quot;&gt;&lt;code&gt;L-11&lt;/code&gt;&lt;/th&gt;
            &lt;td&gt;Low&lt;/td&gt;
            &lt;td&gt;Performance monitoring is mostly unconsumed overhead.&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;audit-status&quot; data-kind=&quot;fixed&quot;&gt;Fixed&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;Unconsumed recommendation/timer work was removed or bounded behind an actual diagnostics consumer.&lt;/td&gt;
          &lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section id=&quot;addendum&quot; aria-labelledby=&quot;addendum-title&quot;&gt;
    &lt;h2 id=&quot;addendum-title&quot;&gt;Post-audit runtime and transactional addenda&lt;/h2&gt;
    &lt;p&gt;&lt;strong&gt;Medium / Fixed — transactional subtitle acceptance previously committed before delivery.&lt;/strong&gt; Acceptance now follows one ordered transaction: validate, project and invoke the callback, recheck the live route and request generation, then commit. Regression coverage proves a thrown callback leaves the request retryable and a stale route cannot commit.&lt;/p&gt;
    &lt;h3&gt;Runtime validation fixes completed after the original ledger&lt;/h3&gt;
    &lt;ul class=&quot;audit-list&quot;&gt;
      &lt;li&gt;&lt;strong&gt;Disney subtitle transport:&lt;/strong&gt; Disney-only requests may follow redirects with omitted credentials after pre-validating the signed request. The final response must remain on the fixed CDN authority and retain the exact path/query; original subtitles remain mandatory, target subtitles optional, and failure telemetry exposes only fixed stages and error codes.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;SPA player ownership:&lt;/strong&gt; delayed navigation cleanup preserves a destination player that the adapter already adopted, while non-adopted navigation clears the old request, queue, DOM, event buffer, and canonical word selection before rearming detection.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Subtitle presentation latency and cost:&lt;/strong&gt; Disney uses one lifecycle-owned &lt;code&gt;requestVideoFrameCallback&lt;/code&gt; chain so ready cues appear on the first presented frame after start/end boundaries. A cached next boundary avoids an episode-wide scan on intervening frames; &lt;code&gt;timeupdate&lt;/code&gt; remains the fallback.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;AI word-selection playback UX:&lt;/strong&gt; Disney pause goes through its native play/pause controller and never falls back to raw media pause. Side-panel selection clears on subtitle render/refresh/expiry; legacy modal close clears canonical selection. Exact side-panel rejection or proven non-delivery falls back once to the modal after owner/snapshot revalidation, while ambiguous channel closure does not duplicate UI.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Configuration and dormant-route closure:&lt;/strong&gt; unconfirmed single/batch writes can no longer promote raw input, logging refresh failure cannot redefine a persisted write, provider catalogs remain generation/identity bound, and orphaned provider-switch/model-enumeration plus &lt;code&gt;batch_processing&lt;/code&gt; branches were removed after zero-caller verification.&lt;/li&gt;
    &lt;/ul&gt;
    &lt;p&gt;These addenda are fixed and root-replayed but remain excluded from the original 35-finding denominator.&lt;/p&gt;
  &lt;/section&gt;

  &lt;section id=&quot;residuals&quot; aria-labelledby=&quot;residuals-title&quot;&gt;
    &lt;h2 id=&quot;residuals-title&quot;&gt;Residual and boundary register&lt;/h2&gt;
    &lt;ul class=&quot;audit-list&quot;&gt;
      &lt;li&gt;&lt;strong&gt;Page-observable token replay:&lt;/strong&gt; a same-document page script may observe and replay the current injection capability while it remains valid. Revocation, exact copying, route identity, sender binding, and destination policy bound the effect but do not make page-world data confidential.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Transparent proxies and monkey-patched primitives:&lt;/strong&gt; JavaScript cannot prove that an apparently ordinary page-world value or primitive is non-hostile without executing potentially trapped behavior. Explicit authority-critical records are copied and validated; full SES-style hardening is out of scope.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Never-settling thenables:&lt;/strong&gt; an accepted external thenable can delay its own lifecycle settlement indefinitely. Generations prevent stale completion from committing, but the language cannot force arbitrary thenables to settle.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Live Disney CDN shape:&lt;/strong&gt; deterministic regressions cover the reported 538-character signed request and same-path/query redirect chain, but the failing live response was not available. Browser redirect following exposes only the final response, so intermediate hops cannot be inspected before following.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Live Disney player controls:&lt;/strong&gt; tests cover localized labels and current open-shadow native controls. A closed shadow root or temporarily absent control fails safely without raw &lt;code&gt;video.pause()&lt;/code&gt;, but the current signed-in player DOM still requires a manual smoke test.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Identical adjacent cues:&lt;/strong&gt; distinct adjacent cues that retain the same rendered identity can keep a word selected across that invisible boundary until a later refresh or expiry.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Frame-cache mutation boundary:&lt;/strong&gt; production queue writers replace the queue, change its length, or explicitly invalidate after translation. A hypothetical external in-place timing mutation of a middle cue with unchanged array identity, length, and edge cues is not detected in constant time; continuous reverse playback intentionally rescans decreasing frames for correctness.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Netflix response ceiling:&lt;/strong&gt; the 2 MiB TTML/body ceiling is enforced, but it has not been validated against the live Netflix catalog.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Chrome host permission breadth:&lt;/strong&gt; match patterns grant the configured scheme and host across paths and ports. The UI now discloses this host-wide/all-port authority while retaining the precise configured endpoint.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Already-dispatched provider work:&lt;/strong&gt; browser messaging cannot cancel a provider fetch already accepted by the background worker. Cancellation and generation checks guarantee that its stale completion cannot commit.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/section&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
