name: Release

on:
    push:
        branches: [main]

permissions:
    contents: write

concurrency:
    group: release-main
    cancel-in-progress: false

jobs:
    release:
        name: Release new extension version
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: npm

            - name: Use project npm version
              run: npm install --global "$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).packageManager")"

            - name: Install dependencies
              run: npm ci

            - name: Audit dependencies
              run: npm audit --audit-level=high

            - name: Check formatting
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Test with coverage ratchet
              run: npm run test:coverage

            - name: Build extension
              run: npm run build

            - name: Verify extension artifact
              run: npm run verify:build

            - name: Read release version
              id: version
              shell: bash
              run: |
                  version=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "tag=v$version" >> "$GITHUB_OUTPUT"

            - name: Check for an existing release
              id: existing_release
              shell: bash
              run: |
                  if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
                    echo "exists=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "exists=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Package extension
              if: steps.existing_release.outputs.exists == 'false'
              shell: bash
              run: |
                  archive="dualsub-${{ steps.version.outputs.tag }}.zip"
                  (cd dist && zip -qr "../$archive" .)
                  unzip -t "$archive"

            - name: Create GitHub release
              if: steps.existing_release.outputs.exists == 'false'
              shell: bash
              run: |
                  archive="dualsub-${{ steps.version.outputs.tag }}.zip"
                  gh release create "${{ steps.version.outputs.tag }}" "$archive" \
                    --generate-notes \
                    --latest \
                    --target "$GITHUB_SHA" \
                    --title "Release ${{ steps.version.outputs.tag }}"
