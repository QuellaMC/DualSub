name: Release

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        name: Release new extension version
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm

            - name: Use project npm version
              run: npm install --global "$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).packageManager")"

            - name: Install dependencies
              run: npm ci

            - name: Audit dependencies
              run: npm audit --audit-level=high

            - name: Check formatting
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Type-check
              run: npm run compile

            - name: Build extension
              run: npm run build

            - name: Test with coverage floors
              run: npm run test:coverage

            - name: Package extension
              run: npm run zip

            - name: Verify release artifact
              run: npm run verify:release

            - name: Read release version
              id: version
              shell: bash
              run: |
                  version=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "tag=v$version" >> "$GITHUB_OUTPUT"
                  if [[ "$version" == *-* ]]; then
                    echo "prerelease=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "prerelease=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Check for an existing release
              id: existing_release
              shell: bash
              run: |
                  if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
                    echo "exists=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "exists=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Write release notes from the changelog
              if: steps.existing_release.outputs.exists == 'false'
              shell: bash
              run: |
                  awk -v v="${{ steps.version.outputs.version }}" \
                    'BEGIN { p = 0 } /^## \[/ { if (p) exit; p = ($2 == "[" v "]") } p' \
                    CHANGELOG.md > release-notes.md
                  if [[ ! -s release-notes.md ]]; then
                    echo "CHANGELOG.md has no section for ${{ steps.version.outputs.version }}" >&2
                    exit 1
                  fi

            - name: Create GitHub release
              if: steps.existing_release.outputs.exists == 'false'
              shell: bash
              run: |
                  archive="dualsub-${{ steps.version.outputs.tag }}.zip"
                  cp ".output/dualsub-${{ steps.version.outputs.version }}-chrome.zip" "$archive"
                  if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
                    flags=(--prerelease)
                  else
                    flags=(--latest)
                  fi
                  gh release create "${{ steps.version.outputs.tag }}" "$archive" \
                    --notes-file release-notes.md \
                    --generate-notes \
                    --target "$GITHUB_SHA" \
                    --title "Release ${{ steps.version.outputs.tag }}" \
                    "${flags[@]}"
