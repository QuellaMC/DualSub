name: CI

on:
    pull_request:
    push:
        branches: [main, rebuild/v3]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: Verify extension
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: npm

            - name: Use project npm version
              run: npm install --global "$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).packageManager")"

            - name: Install dependencies
              run: npm ci

            - name: Audit dependencies
              run: npm audit --audit-level=high

            - name: Check formatting
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Type-check
              run: npm run compile

            - name: Build extension
              run: npm run build

            - name: Test
              run: npm test

            - name: Build legacy extension
              run: npm run legacy:build

            - name: Verify legacy extension artifact
              run: npm run legacy:verify
